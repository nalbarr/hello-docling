[project]
name = "hello-docling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.8"
dependencies = [
    "docling>=2.113.0",
    "mlx-vlm>=0.1.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_docling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
